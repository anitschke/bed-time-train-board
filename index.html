<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#121212">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <title>Bedtime Train Board</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: #121212;
            color: #eee;
            text-align: center;
        }
        h1 { margin-bottom: 24px; font-size: 26px; }
        .card {
            background: #1e1e1e;
            border-radius: 12px;
            padding: 20px;
            margin: 0 auto 20px auto;
            max-width: 360px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 16px;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:active { filter: brightness(0.85); }
        .btn-train { background: #16a34a; width: 100%; margin-bottom: 12px; }
        .btn-cancel { background: #dc2626; width: 100%; }
        .slider-box { margin-top: 16px; }
        .slider-box input { width: 100%; margin: 12px 0; }
        .slider-label { font-size: 18px; font-weight: bold; }
        .notice { margin-top: 12px; font-size: 14px; color: #aaa; min-height: 20px; }
    </style>
</head>
<body>
    <h1>🚂 Train Board</h1>

    <div class="card">
        <h3>Countdown Presets</h3>
        <div class="btn-grid">
            <button onclick="startCountdown(120)">2 min</button>
            <button onclick="startCountdown(300)">5 min</button>
            <button onclick="startCountdown(600)">10 min</button>
            <button onclick="startCountdown(900)">15 min</button>
        </div>

        <div class="slider-box">
            <div class="slider-label"><span id="minsVal">7</span> minutes</div>
            <input type="range" id="minsSlider" min="1" max="30" value="7" oninput="updateSlider(this.value)">
            <button style="width: 100%;" onclick="startSlider()">Start Custom Countdown</button>
        </div>
    </div>

    <div class="card">
        <button class="btn-train" onclick="sendAction('/api/v1/train')">🚂 Play Train Now</button>
        <button class="btn-cancel" onclick="sendAction('/api/v1/cancel')">Cancel</button>
        <div class="notice" id="notice"></div>
    </div>

    <script>
        function updateSlider(val) {
            document.getElementById('minsVal').innerText = val;
        }
        function setNotice(msg) {
            const el = document.getElementById('notice');
            el.innerText = msg;
            setTimeout(() => { if (el.innerText === msg) el.innerText = ''; }, 3000);
        }
        function sendAction(url) {
            fetch(url, { method: 'POST' })
                .then(r => r.text())
                .then(txt => setNotice(txt))
                .catch(err => setNotice('Error: ' + err));
        }
        function startCountdown(seconds) {
            sendAction('/api/v1/timer?seconds=' + seconds);
        }
        function startSlider() {
            const mins = document.getElementById('minsSlider').value;
            startCountdown(mins * 60);
        }
    </script>
</body>
</html>
